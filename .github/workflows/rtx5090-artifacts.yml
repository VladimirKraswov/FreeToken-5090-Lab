name: RTX 5090 benchmark artifacts (CPU only)

on:
  push:
    branches: [rtx5090]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate benchmark fixture and metric arithmetic
        run: python benchmarks/rtx5090/verify_artifacts.py
      - name: Test streaming measurement without a GPU
        run: python benchmarks/rtx5090/test_stream_bench.py
      - name: Check launcher syntax
        run: bash -n deploy/rtx5090/serve.sh
